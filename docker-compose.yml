version: '3.8'

services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/api-gateway"]
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - user-service

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/auth-service"]
    ports:
      - "8081:8081"
      - "50051:50051"

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/user-service"]
    ports:
      - "8082:8082"
      - "50052:50052"

  movie-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/movie-service"]
    ports:
      - "8083:8083"
      - "50053:50053"

  upload-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/upload-service"]
    ports:
      - "8084:8084"
      - "50054:50054"

  streaming-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/streaming-service"]
    ports:
      - "8085:8085"
      
  recommendation-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/recommendation-service"]
    ports:
      - "8086:8086"
      - "50056:50056"

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/notification-service"]
    ports:
      - "8087:8087"
      - "50057:50057"
