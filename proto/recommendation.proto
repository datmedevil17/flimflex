syntax = "proto3";

package recommendation;

option go_package = "proto/recommendation";

service RecommendationService {
  rpc GetRecommendations(GetRecommendationsRequest)
      returns (GetRecommendationsResponse);
}

message GetRecommendationsRequest { string user_id = 1; }

message MovieRecommendation {
  string movie_id = 1;
  float score = 2;
}

message GetRecommendationsResponse {
  repeated MovieRecommendation recommendations = 1;
}
