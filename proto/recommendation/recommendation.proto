syntax = "proto3";

package recommendation;

option go_package = "github.com/datmedevil17/micro-flex/proto/recommendation";

service RecommendationService {
  rpc GetRecommendations(GetRecommendationsRequest) returns (GetRecommendationsResponse);
  rpc GetTrendingMovies(GetTrendingMoviesRequest) returns (GetTrendingMoviesResponse);
  rpc GetSimilarMovies(GetSimilarMoviesRequest) returns (GetSimilarMoviesResponse);
}

message GetRecommendationsRequest {
  string user_id = 1;
  int32 limit = 2;
}

message Recommendation {
  string movie_id = 1;
  double score = 2;
  string reason = 3;
}

message GetRecommendationsResponse {
  repeated Recommendation recommendations = 1;
}

message GetTrendingMoviesRequest {
  int32 limit = 1;
  string time_range = 2; // day, week, month
}

message TrendingMovie {
  string movie_id = 1;
  int32 view_count = 2;
  double trending_score = 3;
}

message GetTrendingMoviesResponse {
  repeated TrendingMovie movies = 1;
}

message GetSimilarMoviesRequest {
  string movie_id = 1;
  int32 limit = 2;
}

message SimilarMovie {
  string movie_id = 1;
  double similarity_score = 2;
}

message GetSimilarMoviesResponse {
  repeated SimilarMovie movies = 1;
}